# Daily pipeline: refreshes the data AND keeps the free Supabase project awake
# (Supabase pauses free projects after 7 days without database activity).
# Two scheduled times: GitHub sometimes delays or drops scheduled runs, so a second
# slot runs only if the first one did not succeed that day. Can also be started by hand.
# Secrets needed (repo Settings -> Secrets and variables -> Actions): DATABASE_URL, GEMINI_API_KEY, FMP_API_KEY.
name: daily-pipeline

on:
  schedule:
    - cron: "17 3 * * *"        # 03:17 UTC = 06:17 Cairo (summer)
    - cron: "47 5 * * *"        # backup: 05:47 UTC = 08:47 Cairo, skipped if today already succeeded
  workflow_dispatch: {}

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - name: Skip if today's run already succeeded
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          n=$(gh run list -R "${{ github.repository }}" -w daily-pipeline --status success --created ">=$(date -u +%F)" --json databaseId --jq length)
          if [ "$n" -gt 0 ]; then echo "Already succeeded today - skipping"; echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

  pipeline:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      PYTHONPATH: src
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Check secrets are set
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::DATABASE_URL secret is missing"; exit 1; fi
          if [ -z "$GEMINI_API_KEY" ]; then echo "::warning::GEMINI_API_KEY missing - the AI step will fail"; fi
          if [ -z "$FMP_API_KEY" ]; then echo "::warning::FMP_API_KEY missing - share prices are skipped"; fi

      - name: Install libraries
        run: pip install -q -r requirements.txt

      - name: Tests (no database - never touches Supabase)
        run: python -m pytest -q

      - name: 1 Bronze (download)
        run: python -m dashboard.bronze
      - name: 2 Silver (clean + load)
        run: python -m dashboard.silver
      - name: 3 Gold (star schema)
        run: python -m dashboard.gold
      - name: 4 Compute (KPIs, sensitivities)
        run: python -m dashboard.compute
      - name: 5 AI brief (stored, never frozen automatically)
        run: python -m dashboard.ai

      # Runs even if a step above failed, so the database still gets activity that day.
      - name: Keep Supabase awake
        if: always()
        run: python -c "from dashboard.db import engine; from sqlalchemy import text; c=engine().connect(); print('db ok:', c.execute(text('select now()')).scalar()); c.close()"
